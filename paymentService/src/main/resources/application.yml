spring:
  application:
    name: paymentService

server:
  port: 8082

# Mock behavior: latency range (ms), random 5xx probability (0–1), optional simulated timeout delay (ms)
app:
  mock:
    latencyMinMs: 200
    latencyMaxMs: 800
    random5xxProbability: 0.05
    simulatedTimeoutDelayMs: 0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    enable:
      jvm: true
      process: true
      http: true
  endpoint:
    metrics:
      enabled: true
  health:
    diskSpace:
      enabled: true
